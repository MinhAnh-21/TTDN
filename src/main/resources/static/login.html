<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Thi Trực Tuyến</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #4facfe, #00c6ff); }
        .container { width: 420px; background: white; border-radius: 18px; padding: 35px; box-shadow: 0 20px 40px rgba(0, 0, 0, .2); }
        .logo { text-align: center; margin-bottom: 25px; }
        .logo h2 { color: #2196f3; }
        .logo p { color: #777; font-size: 14px; }
        h3 { text-align: center; margin-bottom: 20px; color: #333; }
        .input-box { position: relative; margin-bottom: 18px; }
        .input-box input { width: 100%; padding: 13px 45px 13px 15px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 15px; transition: .3s; }
        .input-box input:focus { border-color: #2196f3; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; font-size: 18px; transition: .3s; }
        .toggle-password:hover { color: #2196f3; }
        button { width: 100%; padding: 13px; border: none; border-radius: 8px; background: #2196f3; color: white; font-size: 16px; cursor: pointer; transition: .3s; }
        button:hover { background: #1976d2; }
        .links { margin-top: 18px; text-align: center; }
        .links a { color: #2196f3; text-decoration: none; cursor: pointer; font-weight: 500; }
        .links a:hover { text-decoration: underline; }
        .links small { color: #666; }
        .alert-msg { font-size: 13px; text-align: center; margin-bottom: 15px; padding: 8px; border-radius: 6px; display: none; }
        .alert-msg.error { background: #ffe6e6; color: #d9534f; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <h2>🎓 Thi Trực Tuyến</h2>
        <p>Online Examination System</p>
    </div>

    <h3>Đăng nhập</h3>
    <div id="loginAlert" class="alert-msg"></div>

    <form id="loginForm">
        <div class="input-box">
            <input type="text" id="loginUsername" placeholder="Tên đăng nhập" required>
        </div>

        <div class="input-box">
            <input type="password" id="loginPassword" placeholder="Mật khẩu" required>
            <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePassword('loginPassword', this)"></i>
        </div>

        <button type="submit">Đăng nhập</button>
    </form>

    <div class="links">
        <a href="/forgot.html">Quên mật khẩu?</a>
        <br><br>
        <small>Chưa có tài khoản?</small>
        <a href="/register.html">Đăng ký ngay</a>
    </div>
</div>

<script>
    function togglePassword(inputId, icon){
        const input = document.getElementById(inputId);
        if(input.type === "password"){
            input.type = "text";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }else{
            input.type = "password";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const alertBox = document.getElementById('loginAlert');

        alertBox.className = "alert-msg";

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const data = await response.json();

                // Xóa sạch dữ liệu cũ còn sót trong localStorage
                localStorage.clear();

                // Lưu dữ liệu thực tế của phiên đăng nhập mới
                localStorage.setItem('username', data.username || username);
                const userRole = (data.role || '').toUpperCase();
                localStorage.setItem('role', userRole || 'STUDENT');
                if (data.token) localStorage.setItem('token', data.token);

                // Điều hướng chính xác theo Vai trò
                if (userRole.includes('TEACHER') || userRole.includes('ADMIN')) {
                    window.location.href = "/teacher-dashboard.html";
                } else {
                    window.location.href = "/student-dashboard.html";
                }

            } else {
                alertBox.textContent = "Sai tên đăng nhập hoặc mật khẩu!";
                alertBox.classList.add("error");
            }
        } catch (err) {
            console.error(err);
            alertBox.textContent = "Không thể kết nối đến máy chủ!";
            alertBox.classList.add("error");
        }
    });
</script>

</body>
</html>
