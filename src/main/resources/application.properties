# C?ng ch?y ?ng d?ng
server.port=8080

# C?u hình k?t n?i MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3307/csdl_tt?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

